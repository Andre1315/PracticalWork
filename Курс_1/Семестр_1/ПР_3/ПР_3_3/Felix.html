        <h1>Феликс Ванкель (1902–1988)</h1>
        <p>
            <font size = "+1">
                Немецкий инженер-самоучка. С 1920-х годов разрабатывал идею<br>
                роторного двигателя. В 1957 году на фирме NSU запустил первый<br>
                работающий роторно-поршневой двигатель. Его мотор нашёл<br>
                применение в автомобилях NSU, Mazda и других производителей.
            </font>
        </p>
